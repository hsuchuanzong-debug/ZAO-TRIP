        /* Custom Tailwind Configuration & Base Styles (Updated to Blue-Purple Theme) */
        :root {

        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-light);
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobile App Feel: Fixed bottom bar and full-height content */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff; /* Main App Content Area */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }
        /* Style for horizontal scrolling date bar */
        .scroll-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar for a cleaner mobile look */
        }
        .scroll-container {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* Minimalist Button Style */
        .btn-minimal {
            transition: all 0.2s;
            @apply px-4 py-2 rounded-lg font-medium shadow-sm;
        }
        .btn-minimal:hover {
             @apply shadow-md;
        }
        /* Custom alert/confirm style to replace native alert */
        .custom-dialog {
            transition: opacity 0.3s ease;
        }
    </style>
</head>

        </div>
        <div class="flex space-x-2 ml-4">
            <button class="text-2xl text-emerald-600 hover:text-emerald-800 p-1" onclick="setActiveTab('todo')">
                ✅
            </button>
            <button class="text-2xl text-indigo-600 hover:text-indigo-800 p-1" onclick="setActiveTab('shopping')">
                🛒
            </button>
        </div>
    </header>

        </nav>

        <div id="content-display">
            </div>
    </main>

                地圖

<div id="itinerary-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">

        <input type="hidden" id="edit-activity-index">
        <input type="hidden" id="edit-date">

        <input type="time" id="activity-time" class="w-full p-2 border border-gray-300 rounded-lg mt-1 focus:ring-indigo-500 focus:border-indigo-500">

        <label for="activity-location" class="block text-xs font-medium text-gray-500 mt-4">地點</label>
        <input type="text" id="activity-location" placeholder="例如：海東龍宮寺" class="w-full p-2 border border-gray-300 rounded-lg mt-1 focus:ring-indigo-500 focus:border-indigo-500">

            <button class="btn-minimal bg-indigo-500 text-white" onclick="saveActivity()">儲存</button>

</div>

    // --- Utility Functions ---

    /** Custom Dialog/Confirm Function (取代 alert/confirm) */
    function customConfirm(message, callback) {
        const dialog = document.getElementById('custom-dialog');
        const msg = document.getElementById('dialog-message');
        const confirmBtn = document.getElementById('dialog-confirm');
        const cancelBtn = document.getElementById('dialog-cancel');
        
        msg.textContent = message;
        cancelBtn.classList.remove('hidden');
        
        // Remove previous listeners
        confirmBtn.onclick = null;
        cancelBtn.onclick = null;

        confirmBtn.onclick = () => {
            dialog.classList.add('hidden');
            if (callback) callback(true);
        };

        cancelBtn.onclick = () => {
            dialog.classList.add('hidden');
            if (callback) callback(false);
        };

        dialog.classList.remove('hidden');
    }

    /** Custom Alert Function (取代 alert) */
    function customAlert(message) {
        const dialog = document.getElementById('custom-dialog');
        const msg = document.getElementById('dialog-message');
        const confirmBtn = document.getElementById('dialog-confirm');
        const cancelBtn = document.getElementById('dialog-cancel');
        
        msg.textContent = message;
        cancelBtn.classList.add('hidden');
        
        // Remove previous listener and set new one for alert
        confirmBtn.onclick = null;
        confirmBtn.onclick = () => dialog.classList.add('hidden');

        dialog.classList.remove('hidden');
    }

    /** 模擬匯率換算 (UPDATED for KRW) */
    function convertToTWD(amount, currency) {
        if (currency === 'KRW') {
            return Math.round(amount * MOCK_KRW_TO_TWD_RATE);
        }
        if (currency === 'TWD') {
            return amount;
        }
        return amount;
    }

    /** 生成日期範圍 */
    function generateDates(start, end) {
        const dates = [];
        let currentDate = new Date(start);
        const endDate = new Date(end);

        while (currentDate <= endDate) {
            dates.push(currentDate.toISOString().split('T')[0]);
            currentDate.setDate(currentDate.getDate() + 1);
        }
        return dates;
    }
    
    /** 備註展開/收合功能 */
    function toggleNotes(button, activityId) {
        const notesDiv = document.getElementById(`notes-${activityId}`);
        if (notesDiv.classList.contains('hidden')) {
            notesDiv.classList.remove('hidden');
            button.textContent = '備註詳情 ▼';
        } else {
            notesDiv.classList.add('hidden');
            button.textContent = '備註詳情 ▶';
        }
    }

    /** 渲染橫向日期選單 (使用藍紫色) */
    function renderDateNav() {
        const dateNav = document.getElementById('date-nav');
        dateNav.innerHTML = '';
        const dates = generateDates(tripData.startDate, tripData.endDate);

        if (!currentActiveDate || !dates.includes(currentActiveDate)) {
            currentActiveDate = dates[0] || '';
        }

        dates.forEach(date => {
            const dateObj = new Date(date);
            const dayOfWeek = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];
            const isActive = date === currentActiveDate ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-700 hover:bg-violet-200';

            const button = document.createElement('button');
            button.className = `inline-flex flex-col items-center justify-center p-3 mx-1 rounded-xl w-20 flex-shrink-0 ${isActive}`;
            button.innerHTML = `
                <span class="text-sm font-semibold">${dateObj.getMonth() + 1}/${dateObj.getDate()}</span>
                <span class="text-xs">${dayOfWeek}</span>
            `;
            button.onclick = () => {
                currentActiveDate = date;
                renderDateNav(); // Re-render to update active state
                renderContent(); // Re-render content
            };
            dateNav.appendChild(button);
        });

        // Ensure the active date is visible by scrolling
        setTimeout(() => {
            const activeBtn = dateNav.querySelector('.bg-indigo-600');
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

    // --- Itinerary CRUD Logic ---

    function openItineraryModal(activityId, date) {
        const modal = document.getElementById('itinerary-modal');
        const timeInput = document.getElementById('activity-time');
        const locationInput = document.getElementById('activity-location');
        const notesInput = document.getElementById('activity-notes');
        const modalTitle = document.getElementById('modal-title');
        const editActivityIndex = document.getElementById('edit-activity-index');
        const editDate = document.getElementById('edit-date');

        editDate.value = date;
        editActivityIndex.value = '';

        if (activityId !== null) {
            const dayItinerary = tripData.itineraries.find(i => i.date === date);
            const activity = dayItinerary.activities.find(a => a.id === activityId);
            
            if (activity) {
                modalTitle.textContent = '編輯行程';
                timeInput.value = activity.time;
                locationInput.value = activity.location;
                notesInput.value = activity.notes;
                editActivityIndex.value = activityId;
            }
        } else {
            modalTitle.textContent = '新增行程';
            timeInput.value = '';
            locationInput.value = '';
            notesInput.value = '';
        }

        modal.classList.remove('hidden');
    }

    function closeItineraryModal() {
        document.getElementById('itinerary-modal').classList.add('hidden');
    }

    function saveActivity() {
        const date = document.getElementById('edit-date').value;
        const activityId = parseInt(document.getElementById('edit-activity-index').value);
        const time = document.getElementById('activity-time').value.trim();
        const location = document.getElementById('activity-location').value.trim();
        const notes = document.getElementById('activity-notes').value.trim();

        if (!time || !location) {
            customAlert('時間和地點不能為空！');
            return;
        }
        
        let dayItinerary = tripData.itineraries.find(i => i.date === date);
        if (!dayItinerary) {
            dayItinerary = { date: date, activities: [] };
            tripData.itineraries.push(dayItinerary);
            // Re-sort itineraries after potentially adding a new date
            tripData.itineraries.sort((a, b) => a.date.localeCompare(b.date));
        }

        const newActivity = { 
            time, 
            location, 
            notes, 
            weather: getWeather(location) 
        };

        if (activityId) {
            // Edit existing
            const index = dayItinerary.activities.findIndex(a => a.id === activityId);
            if (index !== -1) {
                dayItinerary.activities[index] = { ...dayItinerary.activities[index], ...newActivity };
            }
        } else {
            // Add new
            newActivity.id = Date.now(); 
            dayItinerary.activities.push(newActivity);
        }

        closeItineraryModal();
        renderItinerary();
        renderDateNav(); // To update date order if a new one was added
    }

    function deleteActivity(activityId) {
        customConfirm('確定要刪除此行程項目嗎？', (confirmed) => {
            if (confirmed) {
                let dayItinerary = tripData.itineraries.find(i => i.date === currentActiveDate);
                if (dayItinerary) {
                    dayItinerary.activities = dayItinerary.activities.filter(a => a.id !== activityId);
                }
                renderItinerary();
            }
        });
    }

    function openListModal(type, itemId = null) {
        const modal = document.getElementById('list-add-modal');
        const title = document.getElementById('list-modal-title');
        const typeInput = document.getElementById('list-modal-type');
        const textInput = document.getElementById('list-modal-text');
        const editIdInput = document.getElementById('list-modal-edit-id');

        typeInput.value = type;
        editIdInput.value = '';

        if (type === 'todo') {
            title.textContent = '新增待辦事項';
            textInput.placeholder = '例如：護照/機票/飯店預約確認';
        } else if (type === 'shopping') {
            title.textContent = '新增購物項目';
            textInput.placeholder = '例如：釜山魚糕 (Samjin Eomuk)';
        }
        
        textInput.value = ''; // Always clear for new item
        
        modal.classList.remove('hidden');
    }

    function closeListModal() {
        document.getElementById('list-add-modal').classList.add('hidden');
    }

    function saveListItem() {
        const type = document.getElementById('list-modal-type').value;
        const text = document.getElementById('list-modal-text').value.trim();

        if (!text) {
            customAlert('請輸入項目內容！');
            return;
        }

        const newItem = { id: Date.now(), text: text };
        
        if (type === 'todo') {
            newItem.completed = false;
            tripData.todoList.push(newItem);
            renderToDoList(); // Re-render TODO list
        } else if (type === 'shopping') {
            newItem.bought = false;
            tripData.shoppingList.push(newItem);
            renderShoppingList(); // Re-render shopping list
        }

        closeListModal();
    }

    function deleteListItem(type, id) {
        const listName = type === 'todo' ? '待辦事項' : '購物項目';
        customConfirm(`確定要刪除此${listName}嗎？`, (confirmed) => {
            if (confirmed) {
                if (type === 'todo') {
                    tripData.todoList = tripData.todoList.filter(item => item.id !== id);
                    renderToDoList();
                } else if (type === 'shopping') {
                    tripData.shoppingList = tripData.shoppingList.filter(item => item.id !== id);
                    renderShoppingList();
                }
            }
        });
    }

    function toggleListStatus(type, id) {
        if (type === 'todo') {
            const item = tripData.todoList.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
            }
            renderToDoList();
        } else if (type === 'shopping') {
            const item = tripData.shoppingList.find(i => i.id === id);
            if (item) {
                item.bought = !item.bought;
            }
            renderShoppingList();
        }
    }


    // --- Expense CRUD Logic (Updated to use Modal) ---
    
    // Helper to toggle members input visibility
    function toggleExpenseMembersVisibility(isShared, elementId = 'expense-members-selection') {
        document.getElementById(elementId).classList.toggle('hidden', !isShared);
    }

    /** 打開支出編輯/新增 Modal */
    function openExpenseModal(expenseId = null) {
        const modal = document.getElementById('expense-modal');
        const title = document.getElementById('expense-modal-title');
        const idInput = document.getElementById('edit-expense-id');
        const descInput = document.getElementById('expense-modal-desc');
        const amountInput = document.getElementById('expense-modal-amount');
        const currencyInput = document.getElementById('expense-modal-currency');
        const sharedInput = document.getElementById('expense-modal-shared');
        const membersInput = document.getElementById('expense-modal-members');

        // Reset form to default (for new entry)
        idInput.value = '';
        descInput.value = '';
        amountInput.value = '';
        currencyInput.value = 'KRW'; // Default to KRW
        sharedInput.checked = false;
        membersInput.value = 'User A, User B';
        toggleExpenseMembersVisibility(false);

        if (expenseId !== null) {
            const expense = tripData.expenses.find(e => e.id === expenseId);
            if (expense) {
                title.textContent = '編輯支出';
                idInput.value = expense.id;
                descInput.value = expense.desc;
                // Display original amount for editing regardless of conversion
                amountInput.value = expense.amount; 
                currencyInput.value = expense.currency;
                sharedInput.checked = expense.shared;
                membersInput.value = expense.members.join(', ');
                toggleExpenseMembersVisibility(expense.shared);
            }
        } else {
            title.textContent = '新增支出';
        }

        modal.classList.remove('hidden');

        // Attach event listener for shared checkbox
        sharedInput.onchange = (e) => toggleExpenseMembersVisibility(e.target.checked);
    }

    function closeExpenseModal() {
        document.getElementById('expense-modal').classList.add('hidden');
    }

    /** 儲存/更新支出項目 */
    function saveExpense() {
        const expenseId = parseInt(document.getElementById('edit-expense-id').value);
        const desc = document.getElementById('expense-modal-desc').value.trim();
        const amount = parseFloat(document.getElementById('expense-modal-amount').value);
        const currency = document.getElementById('expense-modal-currency').value;
        const shared = document.getElementById('expense-modal-shared').checked;
        const membersString = document.getElementById('expense-modal-members').value.trim();
        
        if (!desc || isNaN(amount) || amount <= 0) {
            customAlert('請輸入有效的項目描述和金額。');
            return;
        }

        let members = [];
        if (shared) {
            members = membersString.split(',').map(m => m.trim()).filter(m => m.length > 0);
            if (members.length === 0) {
                 customAlert('您勾選了分帳，但沒有輸入成員。');
                 return;
            }
        }

        const expenseData = {
            desc: desc,
            amount: amount,
            currency: currency,
            twdAmount: convertToTWD(amount, currency), // 執行匯率換算
            shared: shared,
            members: members
        };

        if (expenseId) {
            // Edit existing
            const index = tripData.expenses.findIndex(e => e.id === expenseId);
            if (index !== -1) {
                tripData.expenses[index] = { ...tripData.expenses[index], ...expenseData };
            }
        } else {
            // Add new
            expenseData.id = Date.now(); 
            tripData.expenses.push(expenseData);
        }

        closeExpenseModal();
        renderExpenses();
    }

    function deleteExpense(expenseId) {
         customConfirm('確定要刪除此筆支出紀錄嗎？', (confirmed) => {
            if (confirmed) {
                tripData.expenses = tripData.expenses.filter(e => e.id !== expenseId);
                renderExpenses();
            }
        });
    }

    // --- Backup Spot CRUD Logic ---

    function addBackupSpot() {
        const name = document.getElementById('backup-name').value.trim();
        const reason = document.getElementById('backup-reason').value.trim();

        if (!name || !reason) {
            customAlert('請填寫景點名稱和備用理由。');
            return;
        }

        const newSpot = {
            id: Date.now(),
            name: name,
            reason: reason
        };

        tripData.backupSpots.push(newSpot);

        // Clear form
        document.getElementById('backup-name').value = '';
        document.getElementById('backup-reason').value = '';

        renderBackupSpots();
    }

    function deleteBackupSpot(spotId) {
        customConfirm('確定要刪除此備用景點嗎？', (confirmed) => {
            if (confirmed) {
                tripData.backupSpots = tripData.backupSpots.filter(s => s.id !== spotId);
                renderBackupSpots();
            }
        });
    }

    // --- Initialization ---

    function initializeApp() {
        // 1. Initial Render of Date Nav
        renderDateNav();
        
        // 2. Initial Render of Content
        // Since both header tabs (todo, shopping) make the itinerary button active visually,
        // we default to itinerary on load.
        setActiveTab('itinerary'); 

        // 3. Setup Tab Button Listeners
        document.querySelectorAll('.tab-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                setActiveTab(e.currentTarget.dataset.tab);
            });
        });
    }

    // Start the application when the window loads
    window.onload = initializeApp;

    // Expose functions to global scope for use in inline HTML handlers
    window.toggleNotes = toggleNotes; 
    window.openItineraryModal = openItineraryModal;
    window.closeItineraryModal = closeItineraryModal;
    window.saveActivity = saveActivity;
    window.deleteActivity = deleteActivity;
    
    // Expense CRUD functions
    window.openExpenseModal = openExpenseModal;
    window.closeExpenseModal = closeExpenseModal;
    window.saveExpense = saveExpense; // Save/Edit combined function
    window.deleteExpense = deleteExpense;
    
    window.addBackupSpot = addBackupSpot;
    window.deleteBackupSpot = deleteBackupSpot;
    
    // New List functions
    window.setActiveTab = setActiveTab;
    window.openListModal = openListModal;
    window.closeListModal = closeListModal;
    window.saveListItem = saveListItem;
    window.deleteListItem = deleteListItem;
    window.toggleListStatus = toggleListStatus;

</script>
</body>
